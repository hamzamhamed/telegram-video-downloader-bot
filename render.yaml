services:
  - type: web
    name: telegram-video-downloader-bot
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python bot_webhook.py"
    plan: free
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        value: https://telegram-video-bot.onrender.com/webhook
